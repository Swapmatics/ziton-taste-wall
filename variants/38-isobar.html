<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta http-equiv="Cache-Control" content="no-cache" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Isobar Risk — 38-isobar</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&display=swap" />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>

:root {
  --bg:#0d1b2a;
  --fg:#e0eef8;
  --iso:#4cc9f0;
  --u:1rem;
  --muted: #a0a0a0;
  --mute: #a0a0a0;
}


*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--fg);font-family:Manrope,sans-serif}
a{color:inherit;text-decoration:none}
.nav{display:flex;justify-content:space-between;padding:1rem 1.3rem}
.brand{font-family:"Instrument Serif",serif;font-size:1.25rem}.nav a{font-size:.75rem;color:var(--iso)}
@media(max-width:700px){.nav a:not(.keep){display:none}}
.hero{padding:2.5rem 1.3rem;position:relative;overflow:hidden;min-height:60vh;display:flex;flex-direction:column;justify-content:center}
.iso{position:absolute;inset:10% 5%;border:1px solid color-mix(in srgb,var(--iso) 30%,transparent);border-radius:50%;pointer-events:none}
.iso.b{inset:18% 12%;letter-spacing:.14em;text-transform:uppercase;color:var(--iso);position:relative}
h1{font-family:"Instrument Serif",serif;font-weight:400;font-size:clamp(2.2rem,5vw,3.6rem);line-height:1.1;margin-top:.7rem;max-width:14ch;position:relative}
.sub{margin-top:1rem;max-width:34rem;line-height:1.6;position:relative}
.cta{margin-top:1.4rem;align-self:flex-start;position:relative;border:1px solid var(--iso);color:var(--iso);padding:.6rem 1rem;font-size:.8rem}
.fc{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid color-mix(in srgb,var(--iso) 25%,transparent)}
.fc div{padding:1.2rem 1.3rem;border-right:1px solid color-mix(in srgb,var(--iso) 15%,transparent);font-size:.85rem}
.fc div:last-child{border-right:0}
.fc strong{display:block;font-family:"Instrument Serif",serif;font-size:1.15rem;margin-bottom:.3rem;color:var(--iso)}
@media(max-width:700px){.fc{grid-template-columns:1fr}}


/* contract: de-emphasis via --muted, never opacity */
.tag, .meta, .eyebrow, .kicker, .deck, .chip, .num, .sz, .artist, .byline, .period,
.coords, .status, .live, .chap, .hole + .num, footer, footer.contact, .addr {
  color: var(--muted);
}
nav a, .nav a, .desk a, .links a, .tabs a:not(.focus):not(.keep):not(.p):not(.on),
.topnav a, .corners nav a {
  color: var(--muted);
}
nav a:hover, .nav a:hover { color: var(--fg); }
</style>
</head>
<body>

<header class="nav"><div class="brand">Isobar Risk</div><nav aria-label="Primary"><a href="#forecast">Forecast</a><a class="keep" href="#contact">Bulletin</a></nav></header>
<section class="hero">
  <div class="iso" aria-hidden="true"></div><div class="iso b" aria-hidden="true"></div><div class="iso c" aria-hidden="true"></div>
  <p class="tag">Insurance · London market</p>
  <h1>Pressure systems, named early.</h1>
  <p class="sub">Coverage counsel for towers and captives who prefer a forecast to a surprise.</p>
  <a class="cta" href="#contact">Issue a bulletin</a>
</section>
<section class="fc" id="forecast">
  <div><strong>Front</strong>Emerging exposure</div>
  <div><strong>Gauge</strong>Policy language under load</div>
  <div><strong>Desk</strong>Market intake</div>
</section>

<footer id="contact">Partner intake · contact desk</footer>
</body>
</html>
