<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta http-equiv="Cache-Control" content="no-cache" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Cadence Antitrust — 43-rule-stack</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>

:root{--bg:#f7f5f2;--fg:#121212;--accent:#ff5a1f;--u:1rem}
*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--fg);font-family:Outfit,sans-serif}
a{color:inherit;text-decoration:none}
.nav{display:flex;justify-content:space-between;padding:1rem 1.3rem}
.brand{font-family:Syne,sans-serif;font-weight:700}.nav a{font-size:.75rem;opacity:.55}.nav a.keep{opacity:1;color:var(--accent);font-weight:600}
@media(max-width:600px){.nav a:not(.keep){display:none}}
.hero{padding:2rem 1.3rem}
.rules{display:flex;flex-direction:column;gap:8px;width:min(60vw,320px);margin-bottom:1.5rem}
.rules i{display:block;height:3px;background:var(--fg)}
.rules i:nth-child(1){width:40%}.rules i:nth-child(2){width:70%}.rules i:nth-child(3){width:100%;background:var(--accent)}.rules i:nth-child(4){width:55%}
.tag{font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;opacity:.5}
h1{font-family:Syne,sans-serif;font-weight:800;font-size:clamp(2.2rem,5vw,3.8rem);line-height:1.05;margin-top:.5rem;letter-spacing:-.03em;max-width:12ch}
.sub{margin-top:1rem;line-height:1.6;max-width:34rem}
.cta{display:inline-block;margin-top:1.3rem;background:var(--accent);color:#fff;font-weight:700;padding:.7rem 1.05rem;font-size:.8rem}
.strip{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid #ddd;margin-top:2rem}
.strip div{padding:1.2rem 1.3rem;border-right:1px solid #ddd;font-size:.9rem}
.strip div:last-child{border-right:0}
@media(max-width:700px){.strip{grid-template-columns:1fr}}

</style>
</head>
<body>

<header class="nav"><div class="brand">Cadence Antitrust</div><nav><a href="#matters">Matters</a><a class="keep" href="#contact">Clear</a></nav></header>
<section class="hero">
  <div class="rules" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
  <p class="tag">Antitrust · Brussels / DC</p>
  <h1>Clearance has a cadence.</h1>
  <p class="sub">Merger and conduct counsel for teams who prefer a known tempo to a last-minute scramble.</p>
  <a class="cta" href="#contact">Start clearance</a>
</section>
<section class="strip" id="matters">
  <div><strong>Phase 1 / 2</strong>Mapped early</div>
  <div id="contact"><strong>Intake</strong>Partner clears the path</div>
</section>

</body>
</html>
