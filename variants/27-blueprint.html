<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta http-equiv="Cache-Control" content="no-cache" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Overlay Partners — 27-blueprint</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>

:root{--bg:#0a3a5c;--fg:#cfe9f7;--line:#5eb0d8;--u:1rem}
*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--fg);font-family:"IBM Plex Sans",sans-serif;
background-image:linear-gradient(color-mix(in srgb,var(--line) 18%,transparent) 1px,transparent 1px),linear-gradient(90deg,color-mix(in srgb,var(--line) 18%,transparent) 1px,transparent 1px);
background-size:48px 48px}
a{color:inherit;text-decoration:none}
.nav{display:flex;justify-content:space-between;padding:1rem 1.3rem;font-size:.78rem;border-bottom:1px solid color-mix(in srgb,var(--line) 40%,transparent)}
.brand{font-family:"IBM Plex Mono",monospace;font-size:.85rem}.nav a{opacity:.7}.nav a.keep{opacity:1;border:1px solid var(--line);padding:.3rem .55rem}
@media(max-width:700px){.nav a:not(.keep){display:none}}
.hero{padding:3rem 1.3rem;max-width:820px}
.tag{font-family:"IBM Plex Mono",monospace;font-size:.7rem;letter-spacing:.08em;color:var(--line)}
h1{font-size:clamp(2.1rem,5vw,3.6rem);font-weight:500;line-height:1.1;margin-top:.7rem;max-width:14ch}
.sub{margin-top:1rem;line-height:1.6;max-width:34rem;opacity:.85}
.cta{display:inline-block;margin-top:1.4rem;background:var(--fg);color:var(--bg);font-weight:600;font-size:.8rem;padding:.65rem 1rem}
.specs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1rem;padding:0 1.3rem 2rem;font-family:"IBM Plex Mono",monospace;font-size:.75rem}
.specs div{border:1px solid color-mix(in srgb,var(--line) 45%,transparent);padding:1rem}
@media(max-width:700px){.specs{grid-template-columns:1fr}}

</style>
</head>
<body>

<header class="nav"><div class="brand">Overlay Partners</div><nav><a href="#permits">Permits</a><a href="#disputes">Disputes</a><a class="keep" href="#contact">Overlay</a></nav></header>
<section class="hero">
  <p class="tag">// construction · singapore</p>
  <h1>Draw the conflict before you pour.</h1>
  <p class="sub">Construction and infrastructure counsel for owners who still think in layers.</p>
  <a class="cta" href="#contact">Submit a drawing set</a>
</section>
<section class="specs">
  <div id="permits">PERMIT — sequencing</div>
  <div id="disputes">DISPUTE — delay claims</div>
  <div id="contact">INTAKE — partner desk</div>
</section>

</body>
</html>
