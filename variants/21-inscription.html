<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta http-equiv="Cache-Control" content="no-cache" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Votive Chambers — 21-inscription</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Cormorant+Garamond:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>

:root{--bg:#ebe6dc;--fg:#1c1812;--incise:#5c4a32;--u:1.25rem}
*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--fg);font-family:"Cormorant Garamond",serif}
a{color:inherit;text-decoration:none}
.nav{display:flex;justify-content:center;gap:1.5rem;padding:calc(var(--u)*.9);font-size:.72rem;letter-spacing:.18em;text-transform:uppercase}
.nav .brand{margin-right:auto;font-family:Cinzel,serif;letter-spacing:.08em;font-size:.85rem}
@media(max-width:700px){.nav a:not(.keep){display:none}}
.stone{min-height:72vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:var(--u)}
.panel{border:1px solid color-mix(in srgb,var(--incise) 45%,transparent);padding:calc(var(--u)*2.2) calc(var(--u)*2);max-width:40rem;box-shadow:inset 0 0 0 6px color-mix(in srgb,var(--bg) 70%,transparent),inset 0 0 0 7px color-mix(in srgb,var(--incise) 25%,transparent)}
.tag{font-family:Cinzel,serif;font-size:.65rem;letter-spacing:.22em;text-transform:uppercase;color:var(--incise);margin-bottom:calc(var(--u)*.8)}
h1{font-family:Cinzel,serif;font-weight:500;font-size:clamp(1.7rem,3.8vw,2.6rem);line-height:1.35;letter-spacing:.04em;max-width:18ch}
.sub{margin-top:calc(var(--u)*1);font-size:1.15rem;line-height:1.6;opacity:.8;max-width:28rem;margin-left:auto;margin-right:auto}
.cta{display:inline-block;margin-top:calc(var(--u)*1.4);font-family:Cinzel,serif;font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;border-bottom:1px solid var(--incise);padding-bottom:.2rem;color:var(--incise)}
footer.contact{text-align:center;padding:calc(var(--u)*1.2);font-size:.85rem;opacity:.55;border-top:1px solid color-mix(in srgb,var(--fg) 12%,transparent)}

</style>
</head>
<body>

<header class="nav"><div class="brand">Votive Chambers</div><a href="#practice">Practice</a><a class="keep" href="#contact">Inscribe</a></header>
<section class="stone"><div class="panel">
  <p class="tag">Trusts · Rome / London</p>
  <h1>What we put in stone, we intend to keep.</h1>
  <p class="sub">Continuity counsel for estates that prefer permanence over fashion.</p>
  <a class="cta" href="#contact">Request a reading</a>
</div></section>
<footer class="contact" id="contact"><span id="practice">Private chambers</span> · by introduction</footer>

</body>
</html>
