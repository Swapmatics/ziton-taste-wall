<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Whitaker Chambers — Taste wall 18-oak-chamber</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Raleway|Cormorant:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
:root {
  --bg: #2a231c;
  --fg: #efe6d8;
  --accent: #b8956c;
  --display: "Cormorant", Georgia, serif;
  --body: "Raleway", system-ui, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { min-height: 100%; background: var(--bg); color: var(--fg); font-family: var(--body); }
a { color: inherit; text-decoration: none; }
.brand { font-family: var(--display); letter-spacing: 0.02em; }
h1 { font-family: var(--display); font-weight: 500; line-height: 1.05; }
.sub { opacity: 0.78; max-width: 36rem; line-height: 1.55; }
.cta {
  display: inline-flex; align-items: center; gap: 0.6rem;
  margin-top: 1.75rem; padding: 0.9rem 1.35rem;
  border: 1px solid color-mix(in srgb, var(--fg) 35%, transparent);
  font-size: 0.85rem; letter-spacing: 0.06em; text-transform: uppercase;
  transition: background 0.25s, color 0.25s;
}
.cta:hover { background: var(--fg); color: var(--bg); }
.tag { font-size: 0.72rem; letter-spacing: 0.18em; text-transform: uppercase; opacity: 0.55; }
nav {
  display: flex; justify-content: space-between; align-items: baseline;
  padding: 1.4rem 2rem; position: relative; z-index: 2;
}
nav ul { display: flex; gap: 1.5rem; list-style: none; font-size: 0.8rem; opacity: 0.7; }
@media (max-width: 720px) { nav ul { display: none; } }

.hero { min-height: 100vh; padding: 0 8vw 10vh; display: flex; flex-direction: column; justify-content: flex-end;
  background: linear-gradient(185deg, #3a3228, #2a231c 50%, #1a1510); }
h1 { font-size: clamp(2.8rem, 6vw, 5rem); max-width: 13ch; }
</style>
</head>
<body>

<nav>
  <div class="brand">Whitaker Chambers</div>
  <ul><li>Work</li><li>People</li><li>Insights</li><li>Contact</li></ul>
</nav>
<section class="hero">
  <p class="tag">Arbitration · Geneva</p>
  <h1 style="margin-top:1rem">Neutral ground. Hard advocacy.</h1>
  <p class="sub" style="margin-top:1.2rem">International arbitration for parties who need a sealed outcome.</p>
  <a class="cta" href="#">Engage counsel</a>
</section>
</body>
</html>
