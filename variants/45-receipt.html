<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta http-equiv="Cache-Control" content="no-cache" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Till & Title — 45-receipt</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>

:root {
  --bg:#2a2a2a;
  --paper:#f4f1ea;
  --fg:#111;
  --u:1rem;
  --muted: #a0a0a0;
  --mute: #a0a0a0;
}


*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--fg);font-family:"IBM Plex Mono",monospace;min-height:100vh;display:grid;place-items:center;padding:1.5rem}
a{color:inherit;text-decoration:none}
.receipt{width:min(92vw,340px);background:var(--paper);padding:1.4rem 1.2rem;box-shadow:0 12px 40px color-mix(in srgb,#000 40%,transparent)}
.brand{text-align:center;font-family:"IBM Plex Sans",sans-serif;font-weight:700;font-size:.95rem;letter-spacing:.08em;text-transform:uppercase}
.nav{display:flex;justify-content:center;gap:1rem;margin:.6rem 0 1rem;font-size:.65rem}
.nav a{text-decoration:underline}
@media(max-width:400px){.nav a:not(.keep){display:none}}
.dash{border-top:1px dashed #999;margin:1rem 0}
.tag{font-size:.65rem;text-align:center;letter-spacing:.1em;text-transform:uppercase}
h1{font-family:"IBM Plex Sans",sans-serif;font-size:1.25rem;text-align:center;line-height:1.3;margin-top:.6rem;font-weight:600}
.sub{margin-top:.8rem;font-size:.75rem;line-height:1.5;text-align:center;font-size:.72rem;line-height:1.8}
.lines div{display:flex;justify-content:space-between}
.cta{display:block;text-align:center;margin-top:1.2rem;font-family:"IBM Plex Sans",sans-serif;font-size:.75rem;font-weight:700;text-transform:uppercase;background:var(--fg);color:var(--paper);padding:.7rem}
footer.contact{margin-top:1rem;font-size:.65rem;text-align:center;}


/* contract: de-emphasis via --muted, never opacity */
.tag, .meta, .eyebrow, .kicker, .deck, .chip, .num, .sz, .artist, .byline, .period,
.coords, .status, .live, .chap, .hole + .num, footer, footer.contact, .addr {
  color: var(--muted);
}
nav a, .nav a, .desk a, .links a, .tabs a:not(.focus):not(.keep):not(.p):not(.on),
.topnav a, .corners nav a {
  color: var(--muted);
}
nav a:hover, .nav a:hover { color: var(--fg); }
</style>
</head>
<body>

<article class="receipt">
  <div class="brand">Till & Title</div>
  <nav aria-label="Primary" class="nav"><a href="#items">Items</a><a class="keep" href="#contact">Total</a></nav>
  <div class="dash"></div>
  <p class="tag">Consumer class · nationwide</p>
  <h1>Itemize the harm.</h1>
  <p class="sub">Plaintiff consumer work that reads like a receipt: every line a fact someone can check.</p>
  <div class="lines" id="items">
    <div><span>Overcharge</span><span>shown</span></div>
    <div><span>Notice</span><span>failed</span></div>
    <div><span>Class</span><span>mapped</span></div>
  </div>
  <div class="dash"></div>
  <a class="cta" href="#contact">Submit totals</a>
  <footer class="contact" id="contact">*** partner intake ***</footer>
</article>

</body>
</html>
