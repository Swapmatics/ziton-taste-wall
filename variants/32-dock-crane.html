<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Gantry Counsel — 32-dock-crane</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue:wght@400;500;600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>

:root{--bg:#d5dae0;--fg:#101318;--steel:#1a456e;--s:1.1rem}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font-family:Barlow,sans-serif}
a{color:inherit;text-decoration:none}
.nav{display:flex;justify-content:space-between;padding:1rem 5vw}
.brand{font-family:"Bebas Neue",sans-serif;font-size:1.55rem;letter-spacing:.05em}
.nav a{font-size:.8rem;font-weight:600;text-transform:uppercase;opacity:.65}.nav a.keep{opacity:1;background:var(--steel);color:#fff;padding:.35rem .6rem}
@media(max-width:700px){.nav a:not(.keep){display:none}}
.yard{display:grid;grid-template-columns:64px 1fr 64px;min-height:72vh}
.beam{background:linear-gradient(180deg,#8b949e,#5c6670);position:relative}
.beam::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:3px;background:#2a3138;transform:translateX(-50%)}
.mid{padding:2rem 6vw;display:flex;flex-direction:column;justify-content:flex-end}
@media(max-width:700px){.yard{grid-template-columns:1fr}.beam{display:none}}
.tag{font-size:.75rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;opacity:.6}
h1{font-family:"Bebas Neue",sans-serif;font-weight:400;font-size:clamp(3rem,9vw,6.5rem);line-height:.92;text-transform:uppercase;letter-spacing:.03em;margin-top:.35rem;max-width:12ch}
.sub{margin-top:.9rem;max-width:32rem;font-size:1.05rem;line-height:1.45}
.cta{margin-top:1.3rem;align-self:flex-start;background:var(--fg);color:var(--bg);font-weight:700;text-transform:uppercase;padding:.75rem 1.1rem;font-size:.85rem}
footer.contact{display:grid;grid-template-columns:1fr 1fr 1fr;background:var(--fg);color:#d5dae0;font-size:.85rem}
footer.contact div{padding:1.1rem 5vw;border-right:1px solid color-mix(in srgb,#fff 15%,transparent)}
footer.contact div:last-child{border-right:0}
footer.contact strong{display:block;font-family:"Bebas Neue",sans-serif;font-size:1.3rem;letter-spacing:.04em;margin-bottom:.25rem}
@media(max-width:700px){footer.contact{grid-template-columns:1fr}}

</style>
</head>
<body>

<header class="nav"><div class="brand">Gantry Counsel</div><nav><a href="#ops">Ops</a><a href="#casualty">Casualty</a><a class="keep" href="#contact">Alert</a></nav></header>
<section class="yard">
  <div class="beam" aria-hidden="true"></div>
  <div class="mid">
    <p class="tag">Shipping · Busan</p>
    <h1>Lift the problem. Clear the berth.</h1>
    <p class="sub">Industrial admiralty for owners who measure time in gangs and tides.</p>
    <a class="cta" href="#contact">Alert the desk</a>
  </div>
  <div class="beam" aria-hidden="true"></div>
</section>
<footer class="contact">
  <div id="ops"><strong>Ops</strong>Charter to discharge</div>
  <div id="casualty"><strong>Casualty</strong>Notice with teeth</div>
  <div id="contact"><strong>Desk</strong>24h partner line</div>
</footer>

</body>
</html>
