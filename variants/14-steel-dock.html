<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ironside Maritime — Taste wall 14-steel-dock</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue|Barlow+Condensed:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
:root {
  --bg: #d9dde0;
  --fg: #121418;
  --accent: #1f4e79;
  --display: "Bebas Neue", Georgia, serif;
  --body: "Barlow Condensed", system-ui, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { min-height: 100%; background: var(--bg); color: var(--fg); font-family: var(--body); }
a { color: inherit; text-decoration: none; }
.brand { font-family: var(--display); letter-spacing: 0.02em; }
h1 { font-family: var(--display); font-weight: 500; line-height: 1.05; }
.sub { opacity: 0.78; max-width: 36rem; line-height: 1.55; }
.cta {
  display: inline-flex; align-items: center; gap: 0.6rem;
  margin-top: 1.75rem; padding: 0.9rem 1.35rem;
  border: 1px solid color-mix(in srgb, var(--fg) 35%, transparent);
  font-size: 0.85rem; letter-spacing: 0.06em; text-transform: uppercase;
  transition: background 0.25s, color 0.25s;
}
.cta:hover { background: var(--fg); color: var(--bg); }
.tag { font-size: 0.72rem; letter-spacing: 0.18em; text-transform: uppercase; opacity: 0.55; }
nav {
  display: flex; justify-content: space-between; align-items: baseline;
  padding: 1.4rem 2rem; position: relative; z-index: 2;
}
nav ul { display: flex; gap: 1.5rem; list-style: none; font-size: 0.8rem; opacity: 0.7; }
@media (max-width: 720px) { nav ul { display: none; } }

.hero { min-height: 100vh; padding: 0 5vw 6vh; display: flex; flex-direction: column; justify-content: flex-end;
  background: linear-gradient(180deg, #b8bec4, #9aa3ab 40%, #7d8790); }
h1 { font-size: clamp(3rem, 9vw, 7rem); text-transform: uppercase; letter-spacing: 0.04em; max-width: 12ch; }
</style>
</head>
<body>

<nav>
  <div class="brand">Ironside Maritime</div>
  <ul><li>Work</li><li>People</li><li>Insights</li><li>Contact</li></ul>
</nav>
<section class="hero">
  <p class="tag">Shipping · Singapore</p>
  <h1 style="margin-top:0.5rem">Admiralty with industrial clarity.</h1>
  <p class="sub" style="margin-top:1rem;max-width:28rem">Charter, cargo, and casualty matters for owners and underwriters.</p>
  <a class="cta" href="#">Notify our desk</a>
</section>
</body>
</html>
