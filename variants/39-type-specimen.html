<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta http-equiv="Cache-Control" content="no-cache" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Specimen & Seal — 39-type-specimen</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" />
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>

:root {
  --bg:#faf8f4;
  --fg:#161616;
  --u:1.1rem;
  --muted: #666666;
  --mute: #666666;
}


*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--fg);font-family:"IBM Plex Sans",sans-serif}
a{color:inherit;text-decoration:none}
.nav{display:flex;justify-content:space-between;padding:1rem 1.3rem;border-bottom:1px solid #ddd;font-size:.75rem}
.brand{font-family:"Bodoni Moda",serif;font-size:1.2rem}.nav a{font-weight:600}
@media(max-width:600px){.nav a:not(.keep){display:none}}
.sheet{padding:2rem 1.3rem;max-width:900px}
.row{display:grid;grid-template-columns:6rem 1fr;gap:1rem;align-items:baseline;padding:.85rem 0;border-bottom:1px solid #e8e4dc}
.row .sz{font-size:.7rem;font-variant-numeric:tabular-nums}
.row .Aa{font-family:"Bodoni Moda",serif;line-height:1}
.row.display .Aa{font-size:clamp(2.5rem,6vw,4.5rem)}
.row.subhead .Aa{font-size:1.5rem}
.row.body .Aa{font-size:1rem;font-family:"IBM Plex Sans",sans-serif;max-width:36rem;line-height:1.6}
.cta{display:inline-block;margin-top:1.5rem;border:1px solid var(--fg);padding:.55rem .95rem;font-size:.8rem}
footer.contact{padding:1.2rem 1.3rem;font-size:.85rem;}


/* contract: de-emphasis via --muted, never opacity */
.tag, .meta, .eyebrow, .kicker, .deck, .chip, .num, .sz, .artist, .byline, .period,
.coords, .status, .live, .chap, .hole + .num, footer, footer.contact, .addr {
  color: var(--muted);
}
nav a, .nav a, .desk a, .links a, .tabs a:not(.focus):not(.keep):not(.p):not(.on),
.topnav a, .corners nav a {
  color: var(--muted);
}
nav a:hover, .nav a:hover { color: var(--fg); }
</style>
</head>
<body>

<header class="nav"><div class="brand">Specimen & Seal</div><nav aria-label="Primary"><a href="#weights">Weights</a><a class="keep" href="#contact">Commission</a></nav></header>
<section class="sheet" id="weights">
  <div class="row display"><span class="sz">72</span><h1 class="Aa">Authority</h1></div>
  <div class="row subhead"><span class="sz">24</span><span class="Aa">Specimen & Seal — identity disputes</span></div>
  <div class="row body"><span class="sz">16</span><span class="Aa">Brand, advertising, and reputation counsel for houses that treat their mark like a typeface: one wrong cut ruins the page.</span></div>
  <a class="cta" href="#contact">Commission a review</a>
</section>
<footer class="contact" id="contact">Trademark &amp; advertising desk · Milan / NY</footer>

</body>
</html>
