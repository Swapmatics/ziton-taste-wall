<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Rook Verdicts — 21-brutal-billboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black:wght@400;500;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" />
<style>

:root{--bg:#0a0a0a;--fg:#f4f4ef;--red:#ff2d2d;--u:1rem}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font-family:"Space Grotesk",sans-serif}
a{color:inherit;text-decoration:none}
.bar{display:flex;justify-content:space-between;align-items:center;padding:.85rem 1.1rem;border-bottom:4px solid var(--fg)}
.brand{font-weight:700;letter-spacing:-.02em}
.bar a{background:var(--red);color:#fff;font-weight:700;font-size:.72rem;text-transform:uppercase;padding:.45rem .7rem}
.hero{min-height:78vh;padding:1.2rem 1.1rem 2rem;display:flex;flex-direction:column;justify-content:flex-end}
.stamp{align-self:flex-start;background:var(--red);color:#fff;font-size:.65rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:.3rem .55rem;margin-bottom:1rem}
h1{font-family:"Archivo Black",sans-serif;font-weight:400;font-size:clamp(3.5rem,14vw,9rem);line-height:.88;text-transform:uppercase;letter-spacing:-.04em;max-width:8ch}
.sub{margin-top:1.2rem;font-size:1.1rem;font-weight:500;max-width:34rem;line-height:1.4}
.cta{margin-top:1.5rem;align-self:flex-start;background:var(--fg);color:var(--bg);font-weight:700;text-transform:uppercase;padding:1rem 1.3rem}
.proof{display:grid;grid-template-columns:1fr 1fr;border-top:4px solid var(--fg)}
.proof div{padding:1.3rem 1.1rem;border-right:4px solid var(--fg)}
.proof div:last-child{border-right:0}
.proof h2{font-family:"Archivo Black",sans-serif;font-weight:400;text-transform:uppercase;font-size:1.3rem;margin-bottom:.4rem}
@media(max-width:700px){.proof{grid-template-columns:1fr}.proof div{border-right:0;border-bottom:4px solid var(--fg)}}

</style>
</head>
<body>

<header class="bar"><div class="brand">Rook Verdicts</div><a href="#contact">Case desk</a></header>
<section class="hero">
  <span class="stamp">Plaintiff · Oakland</span>
  <h1>Make them answer.</h1>
  <p class="sub">Jury-first plaintiff work for people who were told to settle and stay quiet.</p>
  <a class="cta" href="#contact">Send the facts</a>
</section>
<section class="proof">
  <div><h2>Story first</h2><p>Narrative built for twelve strangers, not a motion calendar.</p></div>
  <div id="contact"><h2>Intake</h2><p>If the damage is real, we dig — then we decide.</p></div>
</section>

</body>
</html>
