<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta http-equiv="Cache-Control" content="no-cache" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Transept Counsel — 36-chapel-arch</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet" />
<style>

:root{--bg:#14121c;--fg:#efe8dc;--glass:#6b8cae;--u:1.2rem}
*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--fg);font-family:"Source Sans 3",sans-serif}
a{color:inherit;text-decoration:none}
.nav{display:flex;justify-content:space-between;padding:1rem 1.4rem;font-size:.75rem}
.brand{font-family:"Cormorant Garamond",serif;font-size:1.25rem}.nav a{opacity:.55}.nav a.keep{opacity:1;color:var(--glass)}
@media(max-width:600px){.nav a:not(.keep){display:none}}
.nave{min-height:75vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2rem}
.arch{width:min(70vw,280px);height:min(50vw,220px);border:2px solid color-mix(in srgb,var(--glass) 50%,transparent);border-bottom:0;border-radius:140px 140px 0 0;margin-bottom:1.5rem;background:radial-gradient(ellipse at 50% 100%, color-mix(in srgb,var(--glass) 18%,transparent), transparent 70%)}
.tag{font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;opacity:.5}
h1{font-family:"Cormorant Garamond",serif;font-weight:400;font-size:clamp(2.2rem,5vw,3.6rem);line-height:1.15;margin-top:.6rem;max-width:14ch}
.sub{margin-top:1rem;max-width:30rem;line-height:1.6;opacity:.75}
.cta{display:inline-block;margin-top:1.4rem;font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--glass);color:var(--glass);padding:.6rem 1rem}
footer.contact{text-align:center;padding:1.2rem;border-top:1px solid #2a2633;font-size:.85rem;opacity:.55}

</style>
</head>
<body>

<header class="nav"><div class="brand">Transept Counsel</div><nav><a href="#canons">Canons</a><a class="keep" href="#contact">Petition</a></nav></header>
<section class="nave">
  <div class="arch" aria-hidden="true"></div>
  <p class="tag">Faith organizations · Westminster</p>
  <h1>Structure that holds a congregation.</h1>
  <p class="sub">Governance and property counsel for institutions built to outlast a generation of boards.</p>
  <a class="cta" href="#contact">Submit a petition</a>
</section>
<footer class="contact" id="contact"><span id="canons">Canonical &amp; civil</span> · chambers by appointment</footer>

</body>
</html>
