<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta http-equiv="Cache-Control" content="no-cache" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Porte Cochère Legal — 31-concierge</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant:wght@300;400;500;600&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet" />
<style>

:root{--bg:#1a1520;--fg:#f3ebe3;--gold:#c4a574;--u:1.2rem}
*{box-sizing:border-box;margin:0;padding:0}body{background:#0f0c12;color:var(--fg);font-family:Outfit,sans-serif;font-weight:300;min-height:100vh;display:grid;place-items:center;padding:1.5rem}
a{color:inherit;text-decoration:none}
.card{width:min(92vw,380px);background:var(--bg);border:1px solid color-mix(in srgb,var(--gold) 40%,transparent);padding:calc(var(--u)*1.5);min-height:520px;display:flex;flex-direction:column}
.top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:auto}
.brand{font-family:Cormorant,serif;font-size:1.2rem;font-weight:500;color:var(--gold)}
.top a{font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;opacity:.7}
.tag{font-size:.65rem;letter-spacing:.16em;text-transform:uppercase;opacity:.5;margin-bottom:.6rem}
h1{font-family:Cormorant,serif;font-weight:400;font-size:2rem;line-height:1.15;max-width:10ch}
.sub{margin-top:1rem;font-size:.92rem;line-height:1.6;opacity:.75}
.cta{margin-top:1.5rem;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);border:1px solid var(--gold);padding:.65rem .9rem;align-self:flex-start;text-align:center}
.stripe{height:4px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:1.2rem 0}
footer.contact{font-size:.72rem;opacity:.5;margin-top:auto}

</style>
</head>
<body>

<article class="card">
  <header class="top"><div class="brand">Porte Cochère Legal</div><a href="#contact">Ring</a></header>
  <div>
    <p class="tag">Hospitality · Monaco</p>
    <h1>Discretion at the threshold.</h1>
    <div class="stripe" aria-hidden="true"></div>
    <p class="sub">Private client and hospitality counsel for houses that prefer a quiet door.</p>
    <a class="cta" href="#contact">Request an introduction</a>
  </div>
  <footer class="contact" id="contact">Concierge desk · nights answered</footer>
</article>

</body>
</html>
