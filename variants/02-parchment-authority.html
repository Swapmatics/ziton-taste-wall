<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ellison Rowe — Taste wall 02-parchment-authority</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans|Libre+Baskerville:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
:root {
  --bg: #f3eadc;
  --fg: #1a1916;
  --accent: #1e3a5f;
  --display: "Libre Baskerville", Georgia, serif;
  --body: "IBM Plex Sans", system-ui, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { min-height: 100%; background: var(--bg); color: var(--fg); font-family: var(--body); }
a { color: inherit; text-decoration: none; }
.brand { font-family: var(--display); letter-spacing: 0.02em; }
h1 { font-family: var(--display); font-weight: 500; line-height: 1.05; }
.sub { opacity: 0.78; max-width: 36rem; line-height: 1.55; }
.cta {
  display: inline-flex; align-items: center; gap: 0.6rem;
  margin-top: 1.75rem; padding: 0.9rem 1.35rem;
  border: 1px solid color-mix(in srgb, var(--fg) 35%, transparent);
  font-size: 0.85rem; letter-spacing: 0.06em; text-transform: uppercase;
  transition: background 0.25s, color 0.25s;
}
.cta:hover { background: var(--fg); color: var(--bg); }
.tag { font-size: 0.72rem; letter-spacing: 0.18em; text-transform: uppercase; opacity: 0.55; }
nav {
  display: flex; justify-content: space-between; align-items: baseline;
  padding: 1.4rem 2rem; position: relative; z-index: 2;
}
nav ul { display: flex; gap: 1.5rem; list-style: none; font-size: 0.8rem; opacity: 0.7; }
@media (max-width: 720px) { nav ul { display: none; } }

.shell { display: grid; grid-template-columns: 1.1fr 0.9fr; min-height: 100vh; }
@media (max-width: 900px) { .shell { grid-template-columns: 1fr; } }
.left { padding: 2rem 3rem 4rem; display: flex; flex-direction: column; justify-content: center; }
.right { background:
  linear-gradient(160deg, color-mix(in srgb, var(--accent) 85%, black), color-mix(in srgb, var(--accent) 40%, #000));
  min-height: 40vh; position: relative; }
.right::after { content: ""; position: absolute; inset: 12% 14%; border: 1px solid color-mix(in srgb, white 25%, transparent); }
h1 { font-size: clamp(2.6rem, 5.5vw, 4.4rem); max-width: 12ch; }

.hero-visual {
  display: block;
  width: min(92vw, 1100px);
  height: auto;
  margin: 1.5rem 0 0;
  object-fit: cover;
  max-height: 42vh;
}
</style>
</head>
<body>

<nav>
  <div class="brand">Ellison Rowe</div>
  <ul><li>Work</li><li>People</li><li>Insights</li><li>Contact</li></ul>
</nav>
<div class="shell">
  <div class="left">
    <p class="tag">Corporate · New York</p>
    <h1 style="margin-top:1rem">Quiet power. Exact counsel.</h1>
<img class="hero-visual" src="../assets/02.svg" width="1600" height="1000" alt="Hero atmosphere for variant 02" />

    <p class="sub" style="margin-top:1.2rem">M&A and governance for boards who prefer precision to noise.</p>
    <a class="cta" href="#">Speak with a partner</a>
  </div>
  <div class="right" aria-hidden="true"></div>
</div>
</body>
</html>
