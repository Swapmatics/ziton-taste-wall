<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Whitmore Cullen — Taste wall 06-editorial-column</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Public+Sans|Newsreader:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
:root {
  --bg: #f7f5f0;
  --fg: #111;
  --accent: #b33a3a;
  --display: "Newsreader", Georgia, serif;
  --body: "Public Sans", system-ui, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { min-height: 100%; background: var(--bg); color: var(--fg); font-family: var(--body); }
a { color: inherit; text-decoration: none; }
.brand { font-family: var(--display); letter-spacing: 0.02em; }
h1 { font-family: var(--display); font-weight: 500; line-height: 1.05; }
.sub { opacity: 0.78; max-width: 36rem; line-height: 1.55; }
.cta {
  display: inline-flex; align-items: center; gap: 0.6rem;
  margin-top: 1.75rem; padding: 0.9rem 1.35rem;
  border: 1px solid color-mix(in srgb, var(--fg) 35%, transparent);
  font-size: 0.85rem; letter-spacing: 0.06em; text-transform: uppercase;
  transition: background 0.25s, color 0.25s;
}
.cta:hover { background: var(--fg); color: var(--bg); }
.tag { font-size: 0.72rem; letter-spacing: 0.18em; text-transform: uppercase; opacity: 0.55; }
nav {
  display: flex; justify-content: space-between; align-items: baseline;
  padding: 1.4rem 2rem; position: relative; z-index: 2;
}
nav ul { display: flex; gap: 1.5rem; list-style: none; font-size: 0.8rem; opacity: 0.7; }
@media (max-width: 720px) { nav ul { display: none; } }

.hero { min-height: 100vh; display: grid; grid-template-columns: 120px 1fr; }
.rail { writing-mode: vertical-rl; transform: rotate(180deg); padding: 2rem 0; border-right: 1px solid color-mix(in srgb, var(--fg) 12%, transparent);
  font-size: 0.7rem; letter-spacing: 0.25em; text-transform: uppercase; opacity: 0.45; text-align: center; }
.main { padding: 4rem 6vw; display: flex; flex-direction: column; justify-content: center; }
h1 { font-size: clamp(2.6rem, 5vw, 4.6rem); max-width: 14ch; border-left: 3px solid var(--accent); padding-left: 1.2rem; }

.hero-visual {
  display: block;
  width: min(92vw, 1100px);
  height: auto;
  margin: 1.5rem 0 0;
  object-fit: cover;
  max-height: 42vh;
}
</style>
</head>
<body>

<nav>
  <div class="brand">Whitmore Cullen</div>
  <ul><li>Work</li><li>People</li><li>Insights</li><li>Contact</li></ul>
</nav>
<section class="hero">
  <div class="rail">Investigations · DC</div>
  <div class="main">
    <h1>Facts, sequenced. Risk, contained.</h1>
<img class="hero-visual" src="../assets/06.svg" width="1600" height="1000" alt="Hero atmosphere for variant 06" />

    <p class="sub" style="margin-top:1.4rem">Regulatory investigations for companies under real pressure.</p>
    <a class="cta" href="#">Open a matter</a>
  </div>
</section>
</body>
</html>
