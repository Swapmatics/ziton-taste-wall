<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta http-equiv="Cache-Control" content="no-cache" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Modul Law — 34-swiss-poster</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet" />
<style>

:root {
  --bg:#f2f2f0;
  --fg:#111;
  --red:#e30613;
  --u:1rem;
  --muted: #666666;
  --mute: #666666;
}


*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--fg);font-family:"DM Sans",sans-serif}
a{color:inherit;text-decoration:none}
.poster{min-height:100vh;display:grid;grid-template-rows:auto 1fr auto;padding:1.2rem}
.nav{display:flex;justify-content:space-between;font-size:.75rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.nav a{color:var(--red)}
@media(max-width:600px){.nav a:not(.keep){display:none}}
.mid{display:grid;grid-template-columns:1fr 1.2fr;gap:1rem;align-items:end;padding:2rem 0}
@media(max-width:800px){.mid{grid-template-columns:1fr}}
.num{font-size:clamp(6rem,22vw,14rem);font-weight:700;line-height:.85;color:var(--red);letter-spacing:-.06em}
h1{font-size:clamp(1.8rem,3.5vw,2.8rem);font-weight:700;line-height:1.1;max-width:12ch;letter-spacing:-.02em}
.sub{margin-top:1rem;max-width:28rem;line-height:1.55;font-size:.95rem}
.cta{display:inline-block;margin-top:1.3rem;background:var(--fg);color:var(--bg);font-weight:700;font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;padding:.7rem 1rem}
.bar{display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;border-top:3px solid var(--fg);padding-top:1rem;font-size:.8rem;font-weight:600}


/* contract: de-emphasis via --muted, never opacity */
.tag, .meta, .eyebrow, .kicker, .deck, .chip, .num, .sz, .artist, .byline, .period,
.coords, .status, .live, .chap, .hole + .num, footer, footer.contact, .addr {
  color: var(--muted);
}
nav a, .nav a, .desk a, .links a, .tabs a:not(.focus):not(.keep):not(.p):not(.on),
.topnav a, .corners nav a {
  color: var(--muted);
}
nav a:hover, .nav a:hover { color: var(--fg); }
</style>
</head>
<body>

<div class="poster">
  <header class="nav"><div>Modul Law</div><nav aria-label="Primary"><a href="#work">Work</a><a class="keep" href="#contact">Kontakt</a></nav></header>
  <section class="mid">
    <div class="num" aria-hidden="true">04</div>
    <div>
      <h1>Only the necessary remains.</h1>
      <p class="sub">Corporate and disputes counsel reduced to what carries load — Zürich discipline for global boards.</p>
      <a class="cta" href="#contact">Send a brief</a>
    </div>
  </section>
  <section id="work" aria-label="Work"><h2>Work</h2><p>Modul · corporate</p></section>
<footer class="bar" id="contact"><span >Modul · corporate</span><span>Partner desk · Zürich</span></footer>
</div>

</body>
</html>
