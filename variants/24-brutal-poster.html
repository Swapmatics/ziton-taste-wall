<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Riot & Record — 24-brutal-poster</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black:wght@400;600;700&family=Work+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
<style>

:root{--bg:#1a1814;--fg:#f3efe6;--red:#ff3b30;--yellow:#f0c84a;--u:1.1rem}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font-family:"Work Sans",sans-serif}
a{color:inherit;text-decoration:none}
.nav{padding:1rem 1.2rem;display:flex;justify-content:space-between}
.brand{font-weight:700;font-size:.9rem}
.nav a{font-size:.72rem;font-weight:700;text-transform:uppercase;background:var(--yellow);color:#111;padding:.4rem .65rem}
.stack{position:relative;min-height:74vh;padding:2rem 1.2rem 3rem;overflow:hidden}
.sheet{position:absolute;border:2px solid var(--fg);padding:1.2rem;background:#231f1a;max-width:min(92vw,420px)}
.sheet.a{top:12%;left:6%;transform:rotate(-3deg);z-index:1}
.sheet.b{top:28%;right:8%;transform:rotate(2.5deg);background:var(--red);color:#fff;z-index:2;font-family:"Archivo Black",sans-serif;font-weight:400;font-size:clamp(2rem,6vw,3.4rem);line-height:.95;text-transform:uppercase}
.sheet.c{bottom:12%;left:14%;z-index:3;max-width:min(90vw,520px)}
.sheet.c h1{font-family:"Archivo Black",sans-serif;font-weight:400;font-size:clamp(2.2rem,7vw,4.2rem);text-transform:uppercase;line-height:.95;letter-spacing:-.02em}
.sheet.c .sub{margin-top:.8rem;font-size:.95rem;line-height:1.45;opacity:.9}
.sheet.c .cta{display:inline-block;margin-top:1rem;background:var(--fg);color:var(--bg);font-weight:700;padding:.7rem 1rem;text-transform:uppercase;font-size:.75rem}
@media(max-width:700px){.sheet{position:relative;top:auto!important;left:auto!important;right:auto!important;bottom:auto!important;transform:none!important;margin-bottom:1rem;max-width:100%}.stack{overflow:visible}}
footer.contact{padding:1rem 1.2rem;border-top:2px solid color-mix(in srgb,var(--fg) 30%,transparent);font-size:.82rem;opacity:.75}

</style>
</head>
<body>

<header class="nav"><div class="brand">Riot & Record</div><a href="#contact">Matter desk</a></header>
<section class="stack">
  <div class="sheet a"><p style="font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;opacity:.7">Plaintiff · Brooklyn</p><p style="margin-top:.6rem;line-height:1.4">We paste the truth where people can see it.</p></div>
  <div class="sheet b">No soft landings.</div>
  <div class="sheet c">
    <h1>Pressure, on record.</h1>
    <p class="sub">Plaintiff advocacy with street clarity and courtroom discipline.</p>
    <a class="cta" href="#contact">Bring the file</a>
  </div>
</section>
<footer class="contact" id="contact">Intake open · we answer like the deadline is already late</footer>

</body>
</html>
