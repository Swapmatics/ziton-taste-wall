<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Novelle Partners — Taste wall 05-atelier-white</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Outfit|Fraunces:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
:root {
  --bg: #faf9f7;
  --fg: #141414;
  --accent: #8b2942;
  --display: "Fraunces", Georgia, serif;
  --body: "Outfit", system-ui, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { min-height: 100%; background: var(--bg); color: var(--fg); font-family: var(--body); }
a { color: inherit; text-decoration: none; }
.brand { font-family: var(--display); letter-spacing: 0.02em; }
h1 { font-family: var(--display); font-weight: 500; line-height: 1.05; }
.sub { opacity: 0.78; max-width: 36rem; line-height: 1.55; }
.cta {
  display: inline-flex; align-items: center; gap: 0.6rem;
  margin-top: 1.75rem; padding: 0.9rem 1.35rem;
  border: 1px solid color-mix(in srgb, var(--fg) 35%, transparent);
  font-size: 0.85rem; letter-spacing: 0.06em; text-transform: uppercase;
  transition: background 0.25s, color 0.25s;
}
.cta:hover { background: var(--fg); color: var(--bg); }
.tag { font-size: 0.72rem; letter-spacing: 0.18em; text-transform: uppercase; opacity: 0.55; }
nav {
  display: flex; justify-content: space-between; align-items: baseline;
  padding: 1.4rem 2rem; position: relative; z-index: 2;
}
nav ul { display: flex; gap: 1.5rem; list-style: none; font-size: 0.8rem; opacity: 0.7; }
@media (max-width: 720px) { nav ul { display: none; } }

.hero { min-height: 100vh; max-width: 1100px; margin: 0 auto; padding: 0 2rem 6rem; display: flex; flex-direction: column; justify-content: center; }
h1 { font-size: clamp(3rem, 7vw, 5.5rem); max-width: 11ch; }
.mark { color: var(--accent); font-size: 4rem; line-height: 0; margin-bottom: 1rem; }
.hairline { height: 1px; background: color-mix(in srgb, var(--fg) 15%, transparent); margin: 2rem 0; width: 100%; }

.hero-visual {
  display: block;
  width: min(92vw, 1100px);
  height: auto;
  margin: 1.5rem 0 0;
  object-fit: cover;
  max-height: 42vh;
}
</style>
</head>
<body>

<nav>
  <div class="brand">Novelle Partners</div>
  <ul><li>Work</li><li>People</li><li>Insights</li><li>Contact</li></ul>
</nav>
<section class="hero">
  <div class="mark">†</div>
  <p class="tag">Boutique · Paris / NY</p>
  <h1 style="margin-top:0.8rem">Fewer clients. Deeper work.</h1>
<img class="hero-visual" src="../assets/05.svg" width="1600" height="1000" alt="Hero atmosphere for variant 05" />

  <div class="hairline"></div>
  <p class="sub">A private practice for founders, families, and cross-border holdings.</p>
  <a class="cta" href="#">Arrange an introduction</a>
</section>
</body>
</html>
