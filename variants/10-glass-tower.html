<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Aether Counsel — Taste wall 10-glass-tower</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Syne|DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
:root {
  --bg: #0e1116;
  --fg: #f0f2f5;
  --accent: #5b8cff;
  --display: "Syne", Georgia, serif;
  --body: "DM Sans", system-ui, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { min-height: 100%; background: var(--bg); color: var(--fg); font-family: var(--body); }
a { color: inherit; text-decoration: none; }
.brand { font-family: var(--display); letter-spacing: 0.02em; }
h1 { font-family: var(--display); font-weight: 500; line-height: 1.05; }
.sub { opacity: 0.78; max-width: 36rem; line-height: 1.55; }
.cta {
  display: inline-flex; align-items: center; gap: 0.6rem;
  margin-top: 1.75rem; padding: 0.9rem 1.35rem;
  border: 1px solid color-mix(in srgb, var(--fg) 35%, transparent);
  font-size: 0.85rem; letter-spacing: 0.06em; text-transform: uppercase;
  transition: background 0.25s, color 0.25s;
}
.cta:hover { background: var(--fg); color: var(--bg); }
.tag { font-size: 0.72rem; letter-spacing: 0.18em; text-transform: uppercase; opacity: 0.55; }
nav {
  display: flex; justify-content: space-between; align-items: baseline;
  padding: 1.4rem 2rem; position: relative; z-index: 2;
}
nav ul { display: flex; gap: 1.5rem; list-style: none; font-size: 0.8rem; opacity: 0.7; }
@media (max-width: 720px) { nav ul { display: none; } }

.hero { min-height: 100vh; padding: 0 6vw; display: grid; align-content: center; gap: 1.2rem;
  background: linear-gradient(200deg, #151a24, #0e1116 55%, #080a0e); }
h1 { font-size: clamp(2.6rem, 5.5vw, 4.8rem); max-width: 13ch; }
.chip { font-size: 0.75rem; opacity: 0.6; font-family: var(--body); }
.gridline { height: 1px; width: min(60vw, 520px); background: linear-gradient(90deg, var(--accent), transparent); }
</style>
</head>
<body>

<nav>
  <div class="brand">Aether Counsel</div>
  <ul><li>Work</li><li>People</li><li>Insights</li><li>Contact</li></ul>
</nav>
<section class="hero">
  <p class="chip">Tech · Seattle</p>
  <div class="gridline"></div>
  <h1>Law at the speed of product.</h1>
  <p class="sub">IP, privacy, and commercial counsel for companies shipping weekly.</p>
  <a class="cta" href="#">Book founder hours</a>
</section>
</body>
</html>
