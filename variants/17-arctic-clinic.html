<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Fjord Legal — Taste wall 17-arctic-clinic</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Josefin+Sans|Hind:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
:root {
  --bg: #f2f6f8;
  --fg: #102030;
  --accent: #2a7a8c;
  --display: "Josefin Sans", Georgia, serif;
  --body: "Hind", system-ui, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { min-height: 100%; background: var(--bg); color: var(--fg); font-family: var(--body); }
a { color: inherit; text-decoration: none; }
.brand { font-family: var(--display); letter-spacing: 0.02em; }
h1 { font-family: var(--display); font-weight: 500; line-height: 1.05; }
.sub { opacity: 0.78; max-width: 36rem; line-height: 1.55; }
.cta {
  display: inline-flex; align-items: center; gap: 0.6rem;
  margin-top: 1.75rem; padding: 0.9rem 1.35rem;
  border: 1px solid color-mix(in srgb, var(--fg) 35%, transparent);
  font-size: 0.85rem; letter-spacing: 0.06em; text-transform: uppercase;
  transition: background 0.25s, color 0.25s;
}
.cta:hover { background: var(--fg); color: var(--bg); }
.tag { font-size: 0.72rem; letter-spacing: 0.18em; text-transform: uppercase; opacity: 0.55; }
nav {
  display: flex; justify-content: space-between; align-items: baseline;
  padding: 1.4rem 2rem; position: relative; z-index: 2;
}
nav ul { display: flex; gap: 1.5rem; list-style: none; font-size: 0.8rem; opacity: 0.7; }
@media (max-width: 720px) { nav ul { display: none; } }

.hero { min-height: 100vh; padding: 0 8vw; display: grid; align-content: center; gap: 1rem; }
h1 { font-size: clamp(2.4rem, 5vw, 4rem); max-width: 14ch; font-weight: 300; letter-spacing: 0.02em; }
.rule-stack { display: flex; flex-direction: column; gap: 4px; width: 3rem; margin-bottom: 1rem; }
.rule-stack span { height: 1px; background: var(--accent); }
</style>
</head>
<body>

<nav>
  <div class="brand">Fjord Legal</div>
  <ul><li>Work</li><li>People</li><li>Insights</li><li>Contact</li></ul>
</nav>
<section class="hero">
  <div class="rule-stack" aria-hidden="true"><span></span><span></span><span></span></div>
  <p class="tag">Life sciences · Stockholm</p>
  <h1>Clinical precision. Legal spine.</h1>
  <p class="sub">Regulatory and IP counsel for companies measuring in phase gates.</p>
  <a class="cta" href="#">Start a dossier</a>
</section>
</body>
</html>
