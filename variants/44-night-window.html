<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta http-equiv="Cache-Control" content="no-cache" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Fenestration Firm — 44-night-window</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Newsreader:wght@400;500;600;700&family=Public+Sans:wght@400;500;600;700&display=swap" />
<link href="https://fonts.googleapis.com/css2?family=Newsreader:wght@400;500;600;700&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>

:root {
  --bg:#0a0c10;
  --fg:#e8e4db;
  --frame:#8a9bb0;
  --u:1.2rem;
  --muted: #a0a0a0;
  --mute: #a0a0a0;
}


*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--fg);font-family:"Public Sans",sans-serif}
a{color:inherit;text-decoration:none}
.nav{display:flex;justify-content:space-between;padding:1rem 1.4rem;font-size:.75rem}
.brand{font-family:Newsreader,serif;font-size:1.2rem}.nav a{margin:0 1.4rem;border:1px solid color-mix(in srgb,var(--frame) 40%,transparent);display:grid;place-items:center;padding:2rem;background:
  radial-gradient(ellipse at 70% 30%, color-mix(in srgb,#3a4a6a 40%,transparent), transparent 55%),
  linear-gradient(180deg,#121622,#0a0c10)}
.inner{max-width:32rem}
.tag{font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;font-weight:500;font-size:clamp(2rem,4.5vw,3.2rem);line-height:1.15;margin-top:.6rem}
.sub{margin-top:1rem;line-height:1.65;margin-top:1.3rem;font-size:.8rem;border-bottom:1px solid var(--frame);padding-bottom:.15rem;color:var(--frame)}
footer.contact{padding:1.2rem 1.4rem;font-size:.85rem;}


/* contract: de-emphasis via --muted, never opacity */
.tag, .meta, .eyebrow, .kicker, .deck, .chip, .num, .sz, .artist, .byline, .period,
.coords, .status, .live, .chap, .hole + .num, footer, footer.contact, .addr {
  color: var(--muted);
}
nav a, .nav a, .desk a, .links a, .tabs a:not(.focus):not(.keep):not(.p):not(.on),
.topnav a, .corners nav a {
  color: var(--muted);
}
nav a:hover, .nav a:hover { color: var(--fg); }
</style>
</head>
<body>

<header class="nav"><div class="brand">Fenestration Firm</div><nav aria-label="Primary"><a href="#city">City</a><a class="keep" href="#contact">Look in</a></nav></header>
<section class="view">
  <div class="inner">
    <p class="tag">Zoning · Chicago</p>
    <h1>The city is the client’s long brief.</h1>
    <p class="sub">Land use and development counsel for builders who read the skyline as an argument.</p>
    <a class="cta" href="#contact">Open a window on the file</a>
  </div>
</section>
<section id="city" aria-label="City practice"><h2>City practice</h2><p>Entitlements · landmark</p></section>
<footer class="contact" id="contact"><span >Entitlements · landmark</span> · evening intake accepted</footer>

</body>
</html>
