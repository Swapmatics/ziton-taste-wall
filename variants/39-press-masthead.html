<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Nameplate Legal — 39-press-masthead</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:wght@400;600;700&family=Source+Serif+4:wght@400;600;700&display=swap" rel="stylesheet" />
<style>

:root{--bg:#faf6ee;--fg:#14110d;--copper:#a35a2a;--s:1.2rem}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font-family:"Source Serif 4",serif}
a{color:inherit;text-decoration:none}
.masthead{padding:2.5rem 1.2rem 1.2rem;text-align:center;border-bottom:4px solid var(--fg)}
.brand{font-family:"Libre Caslon Text",serif;font-weight:700;font-size:clamp(2.8rem,10vw,6.5rem);line-height:.9;letter-spacing:-.02em}
.rule{display:flex;justify-content:center;gap:1.4rem;margin-top:1rem;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase}
.rule a{opacity:.55}.rule a.keep{opacity:1;color:var(--copper);font-weight:700}
@media(max-width:700px){.rule a:not(.keep){display:none}}
.story{max-width:680px;margin:0 auto;padding:2rem 1.2rem}
.kicker{font-size:.72rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--copper)}
h1{font-family:"Libre Caslon Text",serif;font-size:clamp(1.9rem,3.8vw,2.7rem);line-height:1.2;margin-top:.55rem}
.sub{margin-top:1rem;line-height:1.7}
.cta{display:inline-block;margin-top:1.4rem;border:1.5px solid var(--fg);padding:.55rem .95rem;font-size:.85rem;font-weight:600}
footer.contact{max-width:680px;margin:0 auto;padding:1rem 1.2rem 2rem;border-top:1px solid color-mix(in srgb,var(--fg) 18%,transparent);font-size:.88rem;opacity:.7}

</style>
</head>
<body>

<header class="masthead">
  <div class="brand">Nameplate Legal</div>
  <nav class="rule"><a href="#edition">Edition</a><a href="#libel">Libel</a><a class="keep" href="#contact">Desk</a></nav>
</header>
<article class="story">
  <p class="kicker">Media counsel · Montreal</p>
  <h1>Protect the nameplate. Then print.</h1>
  <p class="sub">Media counsel for publishers whose reputation is the product — and the target.</p>
  <a class="cta" href="#contact">Send the page proof</a>
</article>
<footer class="contact" id="contact"><span id="edition">Edition advice</span> · <span id="libel">Libel desk</span> · Same-day briefs</footer>

</body>
</html>
