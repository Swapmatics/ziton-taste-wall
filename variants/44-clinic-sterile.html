<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>White Room Law — 44-clinic-sterile</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;500&family=Hind:wght@300;400;500&display=swap" rel="stylesheet" />
<style>

:root{--bg:#fbfdfe;--fg:#1a2a34;--teal:#3a8a9a;--air:clamp(1.5rem,5vw,3.5rem)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font-family:Hind,sans-serif;font-weight:300}
a{color:inherit;text-decoration:none}
.shell{min-height:100vh;display:flex;flex-direction:column}
.nav{padding:var(--air) var(--air) 0;display:flex;justify-content:space-between}
.brand{font-family:"Josefin Sans",sans-serif;font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;font-weight:400}
.nav a{font-size:.75rem;opacity:.5}.nav a.keep{opacity:.85;color:var(--teal)}
@media(max-width:600px){.nav a:not(.keep){display:none}}
.hero{flex:1;display:flex;flex-direction:column;justify-content:center;padding:var(--air);max-width:40rem}
.tag{font-family:"Josefin Sans",sans-serif;font-size:.65rem;letter-spacing:.16em;text-transform:uppercase;color:var(--teal)}
h1{font-family:"Josefin Sans",sans-serif;font-weight:300;font-size:clamp(2rem,4vw,3rem);line-height:1.2;margin-top:calc(var(--air)*.45)}
.sub{margin-top:calc(var(--air)*.7);line-height:1.75;opacity:.8}
.cta{margin-top:calc(var(--air)*.9);align-self:flex-start;font-size:.8rem;color:var(--teal);letter-spacing:.06em;text-transform:uppercase}
footer.contact{padding:calc(var(--air)*.7) var(--air);font-size:.78rem;opacity:.5;border-top:1px solid color-mix(in srgb,var(--fg) 8%,transparent)}

</style>
</head>
<body>

<div class="shell">
  <header class="nav"><div class="brand">White Room Law</div><nav><a href="#practice">Practice</a><a class="keep" href="#contact">Write</a></nav></header>
  <section class="hero">
    <p class="tag">Life sciences · Copenhagen</p>
    <h1>Nothing extra enters the room.</h1>
    <p class="sub">Sterile counsel for teams who equate noise with contamination — regulatory and IP, quietly exact.</p>
    <a class="cta" href="#contact">Request intake</a>
  </section>
  <footer class="contact" id="contact"><span id="practice">Regulatory · IP</span> · Private intake</footer>
</div>

</body>
</html>
