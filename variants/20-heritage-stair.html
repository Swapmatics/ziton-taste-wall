<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pembroke Legacy — Taste wall 20-heritage-stair</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cabin|EB+Garamond:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
:root {
  --bg: #ebe4d6;
  --fg: #1a1510;
  --accent: #5c2e1a;
  --display: "EB Garamond", Georgia, serif;
  --body: "Cabin", system-ui, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { min-height: 100%; background: var(--bg); color: var(--fg); font-family: var(--body); }
a { color: inherit; text-decoration: none; }
.brand { font-family: var(--display); letter-spacing: 0.02em; }
h1 { font-family: var(--display); font-weight: 500; line-height: 1.05; }
.sub { opacity: 0.78; max-width: 36rem; line-height: 1.55; }
.cta {
  display: inline-flex; align-items: center; gap: 0.6rem;
  margin-top: 1.75rem; padding: 0.9rem 1.35rem;
  border: 1px solid color-mix(in srgb, var(--fg) 35%, transparent);
  font-size: 0.85rem; letter-spacing: 0.06em; text-transform: uppercase;
  transition: background 0.25s, color 0.25s;
}
.cta:hover { background: var(--fg); color: var(--bg); }
.tag { font-size: 0.72rem; letter-spacing: 0.18em; text-transform: uppercase; opacity: 0.55; }
nav {
  display: flex; justify-content: space-between; align-items: baseline;
  padding: 1.4rem 2rem; position: relative; z-index: 2;
}
nav ul { display: flex; gap: 1.5rem; list-style: none; font-size: 0.8rem; opacity: 0.7; }
@media (max-width: 720px) { nav ul { display: none; } }

.hero { min-height: 100vh; padding: 0 7vw 8vh; display: flex; flex-direction: column; justify-content: flex-end; }
.steps { display: flex; flex-direction: column; gap: 0.35rem; margin-bottom: 2rem; width: min(40vw, 280px); }
.steps i { display: block; height: 8px; background: color-mix(in srgb, var(--accent) 45%, transparent); }
.steps i:nth-child(1) { width: 40%; } .steps i:nth-child(2) { width: 65%; } .steps i:nth-child(3) { width: 100%; }
h1 { font-size: clamp(2.6rem, 5.5vw, 4.5rem); max-width: 14ch; }
</style>
</head>
<body>

<nav>
  <div class="brand">Pembroke Legacy</div>
  <ul><li>Work</li><li>People</li><li>Insights</li><li>Contact</li></ul>
</nav>
<section class="hero">
  <div class="steps" aria-hidden="true"><i></i><i></i><i></i></div>
  <p class="tag">Estates · Edinburgh</p>
  <h1 style="margin-top:0.8rem">Inheritance, handled with gravity.</h1>
  <p class="sub" style="margin-top:1.2rem">Scottish and cross-border succession for families with complexity.</p>
  <a class="cta" href="#">Book a chamber visit</a>
</section>
</body>
</html>
