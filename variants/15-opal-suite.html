<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Vellum Group — 15-opal-suite</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Figtree:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<style>

:root { --bg:#141210; --fg:#f3ebe0; --opal:#c4a06a; --g:1.2rem; }
* { box-sizing:border-box; margin:0; padding:0; }
body { background:var(--bg); color:var(--fg); font-family:Figtree,sans-serif; }
a { color:inherit; text-decoration:none; }
.nav {
  display:flex; justify-content:space-between; padding:calc(var(--g)*1) calc(var(--g)*1.4);
}
.brand { font-family:Outfit,sans-serif; font-weight:600; letter-spacing:0.04em; }
.nav a { font-size:0.78rem; opacity:0.6; margin-left:1rem; }
@media (max-width:700px){ .nav .h{display:none;} }
.grid {
  display:grid; grid-template-columns:1.1fr 0.9fr; gap:calc(var(--g)*1.5);
  padding: calc(var(--g)*1) calc(var(--g)*1.4) calc(var(--g)*2); align-items:center;
  min-height:70vh;
}
@media (max-width:900px){ .grid{grid-template-columns:1fr;} }
.tag { font-size:0.7rem; letter-spacing:0.16em; text-transform:uppercase; color:var(--opal); }
h1 { font-family:Outfit,sans-serif; font-weight:500; font-size:clamp(2.6rem,5.8vw,4.4rem); line-height:1.05; max-width:12ch; margin-top:0.7rem; }
.sub { margin-top:1rem; max-width:30rem; line-height:1.6; opacity:0.78; }
.cta {
  display:inline-block; margin-top:1.4rem;
  color:var(--bg); background:var(--opal); font-weight:600; font-size:0.82rem;
  padding:0.7rem 1.1rem;
}
.strip { display:grid; grid-template-rows:1fr 1fr 1fr; gap:0.65rem; }
.cell {
  border:1px solid color-mix(in srgb, var(--opal) 35%, transparent);
  min-height:5.5rem;
  background:
    linear-gradient(135deg, color-mix(in srgb, var(--opal) 18%, transparent), transparent 60%);
  display:flex; align-items:flex-end; padding:0.7rem;
  font-size:0.75rem; letter-spacing:0.08em; text-transform:uppercase; opacity:0.85;
}
.bottom {
  border-top:1px solid color-mix(in srgb, var(--fg) 12%, transparent);
  padding: calc(var(--g)*1.2) calc(var(--g)*1.4);
  display:flex; justify-content:space-between; gap:1rem; flex-wrap:wrap; font-size:0.85rem; opacity:0.7;
}

</style>
</head>
<body>

<header class="nav">
  <div class="brand">Vellum Group</div>
  <nav><a class="h" href="#film">Film</a><a class="h" href="#music">Music</a><a href="#contact">Pitch</a></nav>
</header>
<section class="grid">
  <div>
    <p class="tag">Entertainment · LA</p>
    <h1>Deals with cultural fluency.</h1>
    <p class="sub">Film, music, and talent agreements negotiated with taste and teeth.</p>
    <a class="cta" href="#contact">Pitch a matter</a>
  </div>
  <div class="strip" aria-label="Suite frames">
    <div class="cell" id="film">Picture</div>
    <div class="cell" id="music">Catalogue</div>
    <div class="cell">Talent</div>
  </div>
</section>
<footer class="bottom" id="contact">
  <span>Matters accepted by creative fit first</span>
  <span>LA desk · introductions preferred</span>
</footer>

</body>
</html>
