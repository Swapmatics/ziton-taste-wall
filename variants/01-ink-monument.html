<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ashcroft & Vale — Taste wall 01-ink-monument</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond|Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
:root {
  --bg: #0c0b0a;
  --fg: #f4efe6;
  --accent: #c4a574;
  --display: "Cormorant Garamond", Georgia, serif;
  --body: "Source Sans 3", system-ui, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { min-height: 100%; background: var(--bg); color: var(--fg); font-family: var(--body); }
a { color: inherit; text-decoration: none; }
.brand { font-family: var(--display); letter-spacing: 0.02em; }
h1 { font-family: var(--display); font-weight: 500; line-height: 1.05; }
.sub { opacity: 0.78; max-width: 36rem; line-height: 1.55; }
.cta {
  display: inline-flex; align-items: center; gap: 0.6rem;
  margin-top: 1.75rem; padding: 0.9rem 1.35rem;
  border: 1px solid color-mix(in srgb, var(--fg) 35%, transparent);
  font-size: 0.85rem; letter-spacing: 0.06em; text-transform: uppercase;
  transition: background 0.25s, color 0.25s;
}
.cta:hover { background: var(--fg); color: var(--bg); }
.tag { font-size: 0.72rem; letter-spacing: 0.18em; text-transform: uppercase; opacity: 0.55; }
nav {
  display: flex; justify-content: space-between; align-items: baseline;
  padding: 1.4rem 2rem; position: relative; z-index: 2;
}
nav ul { display: flex; gap: 1.5rem; list-style: none; font-size: 0.8rem; opacity: 0.7; }
@media (max-width: 720px) { nav ul { display: none; } }

.hero { min-height: 100vh; display: flex; flex-direction: column; justify-content: flex-end; padding: 0 8vw 12vh; background:
  radial-gradient(ellipse 80% 60% at 70% 20%, color-mix(in srgb, var(--accent) 18%, transparent), transparent 60%),
  linear-gradient(180deg, transparent 40%, color-mix(in srgb, var(--bg) 80%, black) 100%), var(--bg); }
h1 { font-size: clamp(3.2rem, 9vw, 7rem); max-width: 14ch; }
.accent-rule { width: 4rem; height: 2px; background: var(--accent); margin: 1.5rem 0; }
.plane { position: absolute; inset: 0; background: linear-gradient(115deg, transparent 40%, color-mix(in srgb, var(--accent) 8%, transparent) 100%); pointer-events: none; }

.hero-visual {
  display: block;
  width: min(92vw, 1100px);
  height: auto;
  margin: 1.5rem 0 0;
  object-fit: cover;
  max-height: 42vh;
}
</style>
</head>
<body>

<nav>
  <div class="brand">Ashcroft & Vale</div>
  <ul><li>Work</li><li>People</li><li>Insights</li><li>Contact</li></ul>
</nav>
<div class="plane"></div>
<section class="hero">
  <p class="tag">Litigation · London</p>
  <h1>Cases that redefine markets.</h1>
<img class="hero-visual" src="../assets/01.svg" width="1600" height="1000" alt="Hero atmosphere for variant 01" />

  <div class="accent-rule"></div>
  <p class="sub">Trial-ready counsel for institutions that cannot afford ambiguity.</p>
  <a class="cta" href="#">Request a confidential briefing</a>
</section>
</body>
</html>
