<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Bill of Lading LLP — 31-dock-manifest</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>

:root{--bg:#cfd5da;--fg:#12161a;--steel:#163a5f;--u:1rem}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font-family:"IBM Plex Mono",monospace}
a{color:inherit;text-decoration:none}
.haz{height:8px;background:repeating-linear-gradient(45deg,#c9a227,#c9a227 8px,#12161a 8px,#12161a 16px)}
.nav{display:flex;justify-content:space-between;padding:.9rem 5vw;background:#b9c0c7}
.brand{font-family:"Bebas Neue",sans-serif;font-size:1.5rem;letter-spacing:.04em}
.nav a{font-size:.8rem;font-weight:600;text-transform:uppercase}.nav a.keep{background:var(--steel);color:#fff;padding:.35rem .55rem}
@media(max-width:700px){.nav a:not(.keep){display:none}}
.hero{padding:2rem 5vw}
.tag{font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;opacity:.65}
h1{font-family:"Bebas Neue",sans-serif;font-weight:400;font-size:clamp(2.8rem,8vw,5.5rem);line-height:.95;letter-spacing:.03em;text-transform:uppercase;margin-top:.4rem;max-width:14ch}
.sub{margin-top:.9rem;max-width:36rem;line-height:1.5;font-size:.95rem}
.cta{display:inline-block;margin-top:1.3rem;background:var(--steel);color:#fff;padding:.7rem 1rem;text-transform:uppercase;font-size:.8rem;font-weight:600}
table{width:100%;border-collapse:collapse;font-size:.8rem;margin-top:1.5rem}
th,td{text-align:left;padding:.7rem 5vw;border-top:1px solid color-mix(in srgb,var(--fg) 25%,transparent)}
th{font-family:"Bebas Neue",sans-serif;font-size:1rem;letter-spacing:.05em;font-weight:400}

</style>
</head>
<body>

<div class="haz" aria-hidden="true"></div>
<header class="nav"><div class="brand">Bill of Lading LLP</div><nav><a href="#cargo">Cargo</a><a href="#charter">Charter</a><a class="keep" href="#contact">Notify</a></nav></header>
<section class="hero">
  <p class="tag">Shipping · Rotterdam</p>
  <h1>Manifest the risk. Then move.</h1>
  <p class="sub">Admiralty counsel that reads like operations — line items, liabilities, next port.</p>
  <a class="cta" href="#contact">Notify the desk</a>
</section>
<table>
  <thead><tr><th scope="col">Item</th><th scope="col">Status</th><th scope="col">Desk</th></tr></thead>
  <tbody>
    <tr id="cargo"><td>Cargo claims</td><td>OPEN</td><td>Cargo</td></tr>
    <tr id="charter"><td>Charter disputes</td><td>LIVE</td><td>Fixture</td></tr>
    <tr id="contact"><td>Urgent notice</td><td>24H</td><td>Partner</td></tr>
  </tbody>
</table>

</body>
</html>
